<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">MADRASA PORTAL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap');
        body { font-family: 'Manjari', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; border-top: 8px solid #1a73e8; }
        h2 { color: #1a73e8; margin-bottom: 10px; font-size: 20px; }
        .sub-title { font-size: 13px; background: #fff3cd; color: #856404; padding: 5px 12px; border-radius: 15px; display: inline-block; font-weight: bold; margin-bottom: 15px; }
        select, input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 15px; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 10px; font-family: inherit; }
        button:hover { background: #1557b0; }
        .nav-links { display: flex; justify-content: space-between; margin-top: 15px; font-size: 14px; }
        .nav-links a { color: #1a73e8; text-decoration: none; cursor: pointer; font-weight: bold; }
        .info-box, .report-box { text-align: left; border: 2px solid #f0f0f0; border-radius: 12px; overflow: hidden; margin-top: 15px; background: #fff; }
        .header { background-color: #f8f9fa; padding: 12px; border-bottom: 2px solid #f0f0f0; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 8px 10px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f1f3f5; color: #333; }
        .val { font-weight: bold; text-align: right; color: #1a73e8; }
        .total { background: #1a73e8; color: white; padding: 10px; font-weight: bold; display: flex; justify-content: space-between; font-size: 16px; }
        .result-status { color: white; padding: 8px; margin-top: 8px; border-radius: 6px; font-weight: bold; text-align: center; }
        .stats-box { background: #e8f4fd; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: left; font-size: 14px; line-height: 1.6; border: 1px solid #b6d4fe; }
        .btns { margin-top: 15px; display: flex; gap: 10px; }
        .btn { padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; border: none; cursor: pointer; color: white; flex: 1; text-align: center; font-size: 14px; }
        @media print { .nav-links, .btns, form, h3, .sub-title { display: none; } body { background: white; } .card { box-shadow: none; border: none; width: 100%; max-width: 100%; padding: 0; } }
    </style>
</head>
<body>

<div class="card">
    <h2 id="institutionDisplay">MADRASA PORTAL</h2>
    <div id="examTitleDisplay" class="sub-title">Loading...</div>
    
    <!-- HOME VIEW -->
    <div id="homeView">
        <form id="resultForm">
            <input type="number" id="rollNo" placeholder="Admission Number / Roll No" required>
            <select id="classSelect" required>
                <option value="">Select Class</option>
            </select>
            <button type="submit">Check Result</button>
        </form>
        <div class="nav-links">
            <a onclick="showTeacherLogin()">Teacher Login</a>
            <a onclick="showAdminLogin()">Admin Panel</a>
        </div>
    </div>

    <!-- RESULT VIEW -->
    <div id="resultView" style="display: none;">
        <div id="res"></div>
        <div class="btns">
            <button class="btn" style="background: #6c757d;" onclick="goHome()">Back</button>
            <button class="btn" style="background: #28a745;" onclick="window.print()">Print A4 / PDF</button>  
        </div>
    </div>

    <!-- TEACHER LOGIN -->
    <div id="teacherLoginView" style="display: none;">
        <h3>Teacher Login</h3>
        <input type="password" id="teacherPass" placeholder="Enter Teacher Password">
        <button onclick="verifyTeacher()">Login</button>
        <div class="nav-links"><a onclick="goHome()">Back</a></div>
    </div>

    <!-- TEACHER DASHBOARD -->
    <div id="teacherDashboard" style="display: none; text-align: left;">
        <h3 id="teacherWelcome"></h3>
        <p>Allowed Class: <b id="tClassDisplay"></b></p>
        <div id="teacherMarkContainer"></div>
        <button class="btn" style="background: #dc3545; margin-top:15px;" onclick="goHome()">Logout</button>
    </div>

    <!-- ADMIN LOGIN -->
    <div id="adminLoginView" style="display: none;">
        <h3>Admin Panel Login</h3>
        <input type="password" id="adminPass" placeholder="Enter Admin Password">
        <button onclick="verifyAdmin()">Login</button>
        <div class="nav-links"><a onclick="goHome()">Back</a></div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="adminDashboard" style="display: none; text-align: left;">
        <h3>Admin Dashboard</h3>
        <label>Institution Name:</label>
        <input type="text" id="adminInstName">
        <label>Exam Name:</label>
        <input type="text" id="adminExamName">
        <label>Pass Mark:</label>
        <input type="number" id="adminPassMark">
        <button style="background: #28a745;" onclick="saveConfig()">Save Settings</button>
        
        <hr style="margin: 20px 0;">
        <h4>Class Report & A4 Mark List</h4>
        <select id="adminReportClassSelect">
            <option value="">Select Class for Report</option>
        </select>
        <button style="background: #1a73e8;" onclick="loadAdminReport()">Generate Report & A4 List</button>
        
        <button style="background: #dc3545; margin-top: 15px;" onclick="goHome()">Logout / Back</button>
    </div>

    <!-- ADMIN REPORT VIEW -->
    <div id="adminReportView" style="display: none; text-align: left;">
        <h3 style="text-align:center;">Class Mark Report</h3>
        <div id="adminReportContent"></div>
        <div class="btns">
            <button class="btn" style="background: #6c757d;" onclick="showAdminDashboard()">Back to Admin</button>
            <button class="btn" style="background: #28a745;" onclick="window.print()">Print A4 / PDF</button>  
        </div>
    </div>
</div>

<script>
    const webAppUrl = "https://script.google.com/macros/s/AKfycbxDIUK3YJbjvEiCCNuFjQum3JGPXm_GxuLtJUmoO4X_NzajkOfJvA0dpQmr5iDEfIwDQg/exec";
    let globalConfig = {};
    let teacherAllowedClass = "";

    window.onload = function() {
        fetch(`${webAppUrl}?action=getClasses`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    globalConfig = data.config;
                    document.getElementById('institutionDisplay').innerText = globalConfig.institution;
                    document.getElementById('pageTitle').innerText = globalConfig.institution;
                    document.getElementById('examTitleDisplay').innerText = globalConfig.examName;

                    let select = document.getElementById('classSelect');
                    let adminSelect = document.getElementById('adminReportClassSelect');
                    data.classes.forEach(cls => {
                        select.innerHTML += `<option value="${cls}">${cls}</option>`;
                        adminSelect.innerHTML += `<option value="${cls}">${cls}</option>`;
                    });
                }
            });
    }

    document.getElementById('resultForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const rollNo = document.getElementById('rollNo').value.trim();
        const className = document.getElementById('classSelect').value.trim();

        document.getElementById('homeView').style.display = 'none';
        document.getElementById('resultView').style.display = 'block';
        document.getElementById('res').innerHTML = "<p>റിസൾട്ട് പരിശോധിക്കുന്നു...</p>";

        fetch(`${webAppUrl}?action=getResult&class=${encodeURIComponent(className)}&rollNo=${encodeURIComponent(rollNo)}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    let headers = data.headers;
                    let s = data.student;
                    let passMark = Number(globalConfig.passMark || 30);
                    
                    let h = `<div class="info-box">
                                <div class="header">
                                    <strong>Admission No:</strong> ${s[0]}<br>
                                    <strong>Name:</strong> ${s[1]}<br>
                                    <strong>Class:</strong> ${className}
                                </div>
                                <table>`;
                    let totalVal = "";
                    let isAllPassed = true;

                    for (let i = 2; i < headers.length; i++) {
                        let head = headers[i] ? headers[i].toString().trim() : "";
                        let val = s[i] !== undefined ? s[i].toString().trim() : "";
                        if (head && val !== "" && val !== "-") {
                            if (head.toUpperCase().includes("TOTAL") || head.includes("ആകെ")) {
                                totalVal = val;
                            } else if (!head.toUpperCase().includes("RESULT")) {
                                h += `<tr><td>${head}</td><td class="val">${val}</td></tr>`;
                                if (!isNaN(val) && Number(val) < passMark) {
                                    isAllPassed = false;
                                }
                            }
                        }
                    }
                    h += `</table>`;
                    if (totalVal) h += `<div class="total"><span>TOTAL</span><span>${totalVal}</span></div>`;
                    
                    let resStatus = isAllPassed ? "PASS" : "FAIL";
                    let resBg = isAllPassed ? "#28a745" : "#dc3545";
                    h += `<div class="result-status" style="background:${resBg}">RESULT: ${resStatus}</div>`;
                    h += `</div>`;
                    document.getElementById('res').innerHTML = h;
                } else {
                    document.getElementById('res').innerHTML = `<p style='color:red;'>റിസൾട്ട് കണ്ടെത്താനായില്ല.</p>`;
                }
            });
    });

    function showTeacherLogin() { hideAll(); document.getElementById('teacherLoginView').style.display = 'block'; }
    function showAdminLogin() { hideAll(); document.getElementById('adminLoginView').style.display = 'block'; }
    function showAdminDashboard() { hideAll(); document.getElementById('adminDashboard').style.display = 'block'; }

    function verifyTeacher() {
        let pass = document.getElementById('teacherPass').value;
        fetch(`${webAppUrl}?action=verifyTeacher&pass=${pass}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    teacherAllowedClass = data.allowedClass;
                    hideAll();
                    document.getElementById('teacherDashboard').style.display = 'block';
                    document.getElementById('teacherWelcome').innerText = `Welcome, ${data.teacherName}`;
                    document.getElementById('tClassDisplay').innerText = teacherAllowedClass;
                    loadTeacherMarkEntry(teacherAllowedClass);
                } else {
                    alert("ടീച്ചർ പാസ്‌വേർഡ് തെറ്റാണ്!");
                }
            });
    }

    function loadTeacherMarkEntry(className) {
        fetch(`${webAppUrl}?action=getTeacherClassData&className=${encodeURIComponent(className)}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    let headers = data.headers;
                    let rows = data.rows;
                    let h = `<p><b>Class: ${className} Mark Entry</b></p><div style="max-height:300px; overflow-y:auto;"><table><tr><th>Adm</th><th>Name</th><th>Action</th></tr>`;
                    rows.forEach((r, idx) => {
                        h += `<tr><td>${r[0]}</td><td>${r[1]}</td><td><button onclick='editStudentMarks(${JSON.stringify(r)}, ${JSON.stringify(headers)}, "${className}")' style="padding:5px 10px; font-size:12px;">Edit Marks</button></td></tr>`;
                    });
                    h += `</table></div><div id="editArea"></div>`;
                    document.getElementById('teacherMarkContainer').innerHTML = h;
                }
            });
    }

    function editStudentMarks(row, headers, className) {
        let h = `<h4>Editing: ${row[1]} (Adm: ${row[0]})</h4><div style="text-align:left;">`;
        for(let i=2; i<headers.length; i++) {
            let head = headers[i];
            if(!head.toUpperCase().includes("TOTAL") && !head.toUpperCase().includes("RESULT")) {
                h += `<label>${head}:</label><div style="display:flex; gap:5px; margin-bottom:5px;">
                      <input type="number" id="mark_${i}" value="${row[i]}">
                      <button onclick="saveMark('${row[0]}', ${i}, '${className}')" style="width:80px; padding:6px; font-size:12px;">Save</button></div>`;
            }
        }
        h += `</div>`;
        document.getElementById('editArea').innerHTML = h;
    }

    function saveMark(rollNo, colIndex, className) {
        let mark = document.getElementById(`mark_${colIndex}`).value;
        fetch(`${webAppUrl}?action=saveTeacherMarks&className=${encodeURIComponent(className)}&rollNo=${encodeURIComponent(rollNo)}&colIndex=${colIndex}&mark=${mark}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") alert("മാർക്ക് സേവ് ചെയ്തു!");
                else alert("പരാജയപ്പെട്ടു.");
            });
    }

    function verifyAdmin() {
        let pass = document.getElementById('adminPass').value;
        fetch(`${webAppUrl}?action=verifyAdmin&pass=${pass}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    showAdminDashboard();
                    document.getElementById('adminInstName').value = globalConfig.institution;
                    document.getElementById('adminExamName').value = globalConfig.examName;
                    document.getElementById('adminPassMark').value = globalConfig.passMark || 30;
                } else {
                    alert("തെറ്റായ പാസ്‌വേർഡ്!");
                }
            });
    }

    function saveConfig() {
        let inst = document.getElementById('adminInstName').value;
        let exam = document.getElementById('adminExamName').value;
        let pMark = document.getElementById('adminPassMark').value;
        fetch(`${webAppUrl}?action=updateConfig&institution=${encodeURIComponent(inst)}&examName=${encodeURIComponent(exam)}&passMark=${encodeURIComponent(pMark)}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") { alert("സേവ് ചെയ്തു!"); location.reload(); }
            });
    }

    function loadAdminReport() {
        let className = document.getElementById('adminReportClassSelect').value;
        if(!className) { alert("ക്ലാസ് തെരഞ്ഞെടുക്കുക!"); return; }

        fetch(`${webAppUrl}?action=getAdminClassReport&className=${encodeURIComponent(className)}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    hideAll();
                    document.getElementById('adminReportView').style.display = 'block';
                    let stats = data.stats;
                    let headers = data.headers;
                    
                    let h = `<div class="stats-box">
                               <b>Class:</b> ${className}<br>
                               <b>Total Students:</b> ${stats.total}<br>
                               <b>Passed:</b> <span style="color:green; font-weight:bold;">${stats.passed}</span><br>
                               <b>Failed:</b> <span style="color:red; font-weight:bold;">${stats.failed}</span><br>
                               <b>Pass Percentage:</b> <span style="color:#1a73e8; font-weight:bold;">${stats.percentage}%</span>
                             </div>`;
                             
                    h += `<div style="overflow-x:auto;"><table><tr>`;
                    headers.forEach(head => h += `<th>${head}</th>`);
                    h += `<th>Status</th></tr>`;
                    
                    data.rows.forEach(item => {
                        let r = item.row;
                        h += `<tr>`;
                        r.forEach(cell => h += `<td>${cell}</td>`);
                        let statusColor = item.pass ? "color:green;font-weight:bold;" : "color:red;font-weight:bold;";
                        h += `<td style="${statusColor}">${item.pass ? 'PASS' : 'FAIL'}</td></tr>`;
                    });
                    h += `</table></div>`;
                    document.getElementById('adminReportContent').innerHTML = h;
                }
            });
    }

    function hideAll() {
        document.getElementById('homeView').style.display = 'none';
        document.getElementById('resultView').style.display = 'none';
        document.getElementById('teacherLoginView').style.display = 'none';
        document.getElementById('teacherDashboard').style.display = 'none';
        document.getElementById('adminLoginView').style.display = 'none';
        document.getElementById('adminDashboard').style.display = 'none';
        document.getElementById('adminReportView').style.display = 'none';
    }

    function goHome() { hideAll(); document.getElementById('homeView').style.display = 'block'; }
</script>

</body>
</html>
