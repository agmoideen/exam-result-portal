<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BADRUL HUDHA MADRASA PORTAL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap');
        body { font-family: 'Manjari', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; border-top: 8px solid #1a73e8; }
        h2 { color: #1a73e8; margin-bottom: 15px; font-size: 20px; }
        select, input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 15px; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 10px; font-family: inherit; }
        button:hover { background: #1557b0; }
        .nav-links { display: flex; justify-content: space-between; margin-top: 15px; font-size: 14px; }
        .nav-links a { color: #1a73e8; text-decoration: none; cursor: pointer; font-weight: bold; }
        .info-box { text-align: left; border: 2px solid #f0f0f0; border-radius: 12px; overflow: hidden; margin-top: 15px; }
        .header { background-color: #f8f9fa; padding: 12px; border-bottom: 2px solid #f0f0f0; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 8px 12px; border-bottom: 1px solid #eee; font-size: 14px; }
        .val { font-weight: bold; text-align: right; color: #1a73e8; }
        .total { background: #1a73e8; color: white; padding: 12px; font-weight: bold; display: flex; justify-content: space-between; font-size: 16px; }
        .result-status { color: white; padding: 8px; margin-top: 8px; border-radius: 6px; font-weight: bold; text-align: center; }
        .btns { margin-top: 15px; display: flex; gap: 10px; }
        .btn { padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; border: none; cursor: pointer; color: white; flex: 1; text-align: center; font-size: 14px; }
        @media print { .nav-links, .btns, .card-header-actions { display: none; } body { background: white; } .card { box-shadow: none; border: none; width: 100%; max-width: 100%; } }
    </style>
</head>
<body>

<div class="card">
    <h2>BADRUL HUDHA MADRASA PORTAL</h2>
    
    <!-- HOME / SELECTION VIEW -->
    <div id="homeView">
        <form id="resultForm">
            <input type="text" id="examNameInput" placeholder="Exam Name (Eg: Half Yearly Exam 2026)" required>
            <input type="number" id="rollNo" placeholder="Admission Number / Roll No" required>
            
            <select id="classSelect" required>
                <option value="">Select Class / Sheet</option>
            </select>
            
            <button type="submit">Check Result</button>
        </form>
        <div class="nav-links">
            <a onclick="showTeacherLogin()">Teacher Login</a>
            <a onclick="showAdminLogin()">Admin Panel</a>
        </div>
    </div>

    <!-- RESULT DISPLAY VIEW -->
    <div id="resultView" style="display: none;">
        <div id="examTitleDisplay" style="background: #fff3cd; color: #856404; display: inline-block; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; margin-bottom: 10px;"></div>
        <div id="res"></div>
        <div class="btns">
            <button class="btn" style="background: #6c757d;" onclick="goHome()">Back</button>
            <button class="btn" style="background: #28a745;" onclick="window.print()">Print A4 / PDF</button>  
        </div>
    </div>

    <!-- TEACHER LOGIN VIEW -->
    <div id="teacherLoginView" style="display: none;">
        <h3>Teacher Mark Entry Login</h3>
        <input type="password" id="teacherPass" placeholder="Enter Teacher Password">
        <button onclick="verifyTeacher()">Login</button>
        <div class="nav-links"><a onclick="goHome()">Back to Home</a></div>
    </div>

    <!-- ADMIN LOGIN VIEW -->
    <div id="adminLoginView" style="display: none;">
        <h3>Admin Panel Login</h3>
        <input type="password" id="adminPass" placeholder="Enter Admin Password">
        <button onclick="verifyAdmin()">Login</button>
        <div class="nav-links"><a onclick="goHome()">Back to Home</a></div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="adminDashboard" style="display: none; text-align: left;">
        <h3>Admin Dashboard</h3>
        <p>Manage Exams, Edit Class Sheets, Set Pass Marks & Manage Passwords.</p>
        <button style="background: #28a745;" onclick="alert('നിങ്ങളുടെ ഗൂഗിൾ ഡ്രൈവിൽ പോയി ഷീറ്റ് നേരിട്ട് എഡിറ്റ് ചെയ്യാവുന്നതാണ്.')">Open Google Sheet Config</button>
        <button style="background: #dc3545;" onclick="goHome()">Logout</button>
    </div>

</div>

<script>
    // പുതിയ ഗൂഗിൾ ആപ്പ്സ് സ്ക്രിപ്റ്റ് വെബ് ആപ്പ് ലിങ്ക് ഇവിടെ നൽകിയിരിക്കുന്നു
    const webAppUrl = "https://script.google.com/macros/s/AKfycbzedrnfmO8DVafOoz-sQ3oS-TthLdwNXOU6bPfEsIG7NTjnWl-olRMQAnlpOpNPHNbXqg/exec";

    // ആപ്പ് ഓപ്പൺ ചെയ്യുമ്പോൾ ഷീറ്റിലെ ക്ലാസുകൾ ഓട്ടോമാറ്റിക്കായി ലോഡ് ചെയ്യുന്നു
    window.onload = function() {
        fetch(`${webAppUrl}?action=getClasses`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    let select = document.getElementById('classSelect');
                    data.classes.forEach(cls => {
                        let opt = document.createElement('option');
                        opt.value = cls;
                        opt.textContent = cls;
                        select.appendChild(opt);
                    });
                }
            })
            .catch(err => console.log("Classes load error:", err));
    }

    document.getElementById('resultForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const rollNo = document.getElementById('rollNo').value.trim();
        const className = document.getElementById('classSelect').value.trim();
        const examName = document.getElementById('examNameInput').value.trim();

        document.getElementById('homeView').style.display = 'none';
        document.getElementById('resultView').style.display = 'block';
        document.getElementById('examTitleDisplay').innerText = `${examName} - Class: ${className}`;
        document.getElementById('res').innerHTML = "<p>റിസൾട്ട് പരിശോധിക്കുന്നു...</p>";

        fetch(`${webAppUrl}?action=getResult&class=${encodeURIComponent(className)}&rollNo=${encodeURIComponent(rollNo)}&exam=${encodeURIComponent(examName)}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    let headers = data.headers;
                    let s = data.student;
                    
                    let h = `<div class="info-box">
                                <div class="header">
                                    <strong>Roll/Adm No:</strong> ${s[0]}<br>
                                    <strong>Name:</strong> ${s[1]}<br>
                                    <strong>Class:</strong> ${className}
                                </div>
                                <table>`;
                    let totalVal = "";
                    let resStatus = "";

                    for (let i = 2; i < headers.length; i++) {
                        let head = headers[i] ? headers[i].toString().trim() : "";
                        let val = s[i] !== undefined ? s[i].toString().trim() : "";
                        if (head && val !== "" && val !== "-") {
                            if (head.toUpperCase().includes("TOTAL") || head.includes("ആകെ")) {
                                totalVal = val;
                            } else if (head.toUpperCase().includes("RESULT") || head.includes("ഫലം")) {
                                resStatus = val;
                            } else {
                                h += `<tr><td>${head}</td><td class="val">${val}</td></tr>`;
                            }
                        }
                    }
                    h += `</table>`;
                    if (totalVal) h += `<div class="total"><span>TOTAL</span><span>${totalVal}</span></div>`;
                    if (resStatus) {
                        let isPass = resStatus.toUpperCase() === "PASS" || resStatus.includes("വിജയിച്ചു");
                        h += `<div class="result-status" style="background:${isPass ? '#28a745' : '#dc3545'}">RESULT: ${resStatus}</div>`;
                    }
                    h += `</div>`;
                    document.getElementById('res').innerHTML = h;
                } else {
                    document.getElementById('res').innerHTML = `<p style='color:red;'>റിസൾട്ട് കണ്ടെത്താനായില്ല. നംബർ പരിശോധിക്കുക.</p>`;
                }
            }).catch(err => {
                document.getElementById('res').innerHTML = `<p style='color:red;'>ഡാറ്റ ഫെച്ച് ചെയ്യുന്നതിൽ തടസ്സം നേരിട്ടു.</p>`;
            });
    });

    function showTeacherLogin() {
        document.getElementById('homeView').style.display = 'none';
        document.getElementById('teacherLoginView').style.display = 'block';
    }

    function showAdminLogin() {
        document.getElementById('homeView').style.display = 'none';
        document.getElementById('adminLoginView').style.display = 'block';
    }

    function verifyAdmin() {
        let pass = document.getElementById('adminPass').value;
        if(pass === "admin123") {
            document.getElementById('adminLoginView').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
        } else {
            alert("തെറ്റായ പാസ്‌വേർഡ്!");
        }
    }

    function verifyTeacher() {
        let pass = document.getElementById('teacherPass').value;
        fetch(`${webAppUrl}?action=verifyTeacher&pass=${pass}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    alert(`സ്വാഗതം ${data.teacherName}! മാർക്ക് എട്രി ചെയ്യാൻ അനുവാദമുണ്ട്.`);
                    goHome();
                } else {
                    alert("ടീച്ചർ പാസ്‌വേർഡ് തെറ്റാണ്!");
                }
            });
    }

    function goHome() {
        document.getElementById('homeView').style.display = 'block';
        document.getElementById('resultView').style.display = 'none';
        document.getElementById('teacherLoginView').style.display = 'none';
        document.getElementById('adminLoginView').style.display = 'none';
        document.getElementById('adminDashboard').style.display = 'none';
    }
</script>

</body>
</html>
